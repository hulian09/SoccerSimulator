body{margin:0;background:#10151c;color:#eef3f8;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:22px}
h1{text-align:center;margin:0 0 18px;font-size:30px}
.controls{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;background:#19212b;border:1px solid #2c3845;border-radius:14px;padding:14px;margin-bottom:14px}
select,button{font:inherit;border-radius:9px;border:1px solid #3b4958;background:#222d38;color:#fff;padding:10px 14px}
button{cursor:pointer;font-weight:700} button:hover{background:#2e3b48}
.scorebar{display:flex;justify-content:center;align-items:center;gap:22px;font-weight:700;margin:10px 0}

.timer{text-align:center;font-size:18px;font-weight:700;margin-bottom:10px;letter-spacing:.5px}
canvas{display:block;width:100%;max-width:1000px;height:auto;margin:0 auto;border:2px solid #344352;border-radius:12px;background:#28753e;box-shadow:0 15px 45px rgba(0,0,0,.35)}
.panel{background:#19212b;border:1px solid #2c3845;border-radius:12px;margin-top:14px;padding:14px}
.panel h2{font-size:17px;margin:0 0 10px} #commentary{height:245px;overflow:auto;display:flex;flex-direction:column;gap:7px}
.event{padding:7px 9px;border-radius:8px;background:#202b36;font-size:14px;line-height:1.3}
.event.goal{background:#263f2c;font-weight:700}.event.ht{background:#3b3520;font-weight:700}.event.ft{background:#203449;font-weight:700}
.squads{display:grid;grid-template-columns:1fr 1fr;gap:12px}.squad{background:#202b36;border-radius:9px;padding:10px;font-size:13px}
.squad h3{margin:0 0 7px;font-size:15px}.squad strong{display:block;margin-top:5px}
@media(max-width:700px){.teamname{min-width:120px;font-size:16px}.score{font-size:28px}.squads{grid-template-columns:1fr}}
</style>

</head>

function updateSquads(){
  const render=team=>{
    const d=TEAMS[team];

      .filter(([,names])=>names.length)
      .map(([role,names])=>`${role}: ${names.join(", ")}`)
      .join("<br>");

};

function choosePlayer(side,roles=null){const candidates=state.players.filter(p=>p.side===side&&p.onPitch!==false&&(!roles||roles.includes(p.role)));
return candidates[Math.floor(Math.random()*candidates.length)]||null}

function moveBallTo(player){if(!state.ball||!player)return;

function weightedScorer(side){const weights={GK:0,ST:1.65,LW:1.05,RW:1.05,CAM:.95,CM1:.38,CM2:.38,LB:.06,LCB:.04,RCB:.04,RB:.06};
const candidates=state.players.filter(p=>p.side===side&&p.onPitch!==false&&weights[p.role]>0);
let total=candidates.reduce((s,p)=>s+weights[p.role],0),r=Math.random()*total;
for(const p of candidates){r-=weights[p.role];
if(r<=0)return p}return candidates[0]}

function goal(side){if(state.homeGoals+state.awayGoals>=5)return false;
if(side==="home"&&state.homeGoals>=4)return false;
if(side==="away"&&state.awayGoals>=4)return false;
const scorer=weightedScorer(side);
if(!scorer)return false;
if(side==="home")state.homeGoals++;
else state.awayGoals++;
const netX=side==="home"?PITCH.w-14:14;
state.goalAnimation={active:true,startX:state.ball.x,startY:state.ball.y,netX,netY:PITCH.centerY,start:performance.now(),duration:650};
moveBallTo(scorer);
pushComment(`GOAL! ${scorer.name} finishes for ${state[side]}!`,"goal");
updateScore();
setTimeout(()=>{resetBall();
state.goalAnimation=null},720);
return true}

function availableBackups(side,role){
  const usedNames=new Set(state.players.filter(p=>p.side===side).map(p=>p.name));
return (POSITION_BACKUPS[state[side]]?.[role]||[]).filter(name=>!usedNames.has(name)&&!SUB_STATE[side].injured.has(name));
}

function eligibleSubstitutionOptions(side,injury=false){
  return state.players
    .filter(p=>p.side===side&&p.onPitch!==false&&!p.subbedIn&&(injury||p.role!=="GK"))
    .map(outgoing=>({outgoing,incoming:availableBackups(side,outgoing.role)}))
    .filter(option=>option.incoming.length>0);
}

  injuryOccurredThisMatch=false;

    const starters=TEAMS[state[side]].starters;

      .map(([role])=>role);

const normalMax=Math.min(requested,outfieldRoles.length);
const pool=Array.from({length:37},(_,i)=>52+i);
const schedule=[];
while(schedule.length<normalMax&&pool.length){
      schedule.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
}
    SUB_STATE[side]={normalUsed:0,normalMax,schedule:schedule.sort((a,b)=>a-b),injured:new Set(),lastInjury:-99};
}
}

function benchForSide(side){
  return Object.values(POSITION_BACKUPS[state[side]]||{}).flat()
    .filter(name=>!state.players.some(p=>p.side===side&&p.name===name));
}

function makeSubstitution(side,minute,injury=false){
  const st=SUB_STATE[side];
if(!injury&&st.normalUsed>=st.normalMax)return false;
const options=eligibleSubstitutionOptions(side,injury);
if(!options.length)return false;
const option=options[Math.floor(Math.random()*options.length)];
const outgoing=option.outgoing;
const incoming=option.incoming[0];
// first-listed backup is the designated replacement for this position
  outgoing.onPitch=false;
const base=FORMATION[outgoing.role];
const x=side==="away"?PITCH.w-base.x:base.x;
state.players.push({
    side,team:state[side],role:outgoing.role,name:incoming,
    x,y:base.y,baseX:x,baseY:base.y,phase:Math.random()*6.28,
    radius:18,color:teamColor(state[side],side),onPitch:true,subbedIn:true
  });
if(injury){
    st.injured.add(outgoing.name);
st.lastInjury=minute;
injuryOccurredThisMatch=true;
pushComment(`INJURY — ${outgoing.name} is injured and cannot return. ${incoming} replaces them in the ${outgoing.role} position.`);
}else{
    st.normalUsed++;
pushComment(`${state[side]} substitution: ${incoming} replaces ${outgoing.name} in the ${outgoing.role} position.`);
}
  return true;
}

function runSubstitutionChecks(minute){
  for(const side of ["home","away"]){
    const st=SUB_STATE[side];
if(minute>45&&st.normalUsed<st.normalMax&&st.schedule.length&&minute>=st.schedule[0]){
      st.schedule.shift();
makeSubstitution(side,minute,false);
}
    // Very rare: at most one injury substitution in an entire match.
    if(!injuryOccurredThisMatch&&minute>=5&&Math.random()<0.00025){
      makeSubstitution(side,minute,true);
}
  }
}

function simulateMinute(){if(!state.running||state.paused||state.halfTime||state.finished)return;
state.minute++;
runSubstitutionChecks(state.minute);
if(state.minute===45){pushComment("HALF-TIME","ht");
state.halfTime=true;
setTimeout(()=>{if(!state.finished){state.halfTime=false;
pushComment("Second half underway.")}},1200);
updateScore();
return}if(state.minute>=90){state.minute=90;
state.finished=true;
state.running=false;
pushComment(`FULL-TIME — ${state.home} ${state.homeGoals}-${state.awayGoals} ${state.away}`,"ft");
updateScore();
clearInterval(state.interval);
state.interval=null;
return}const home=TEAMS[state.home],away=TEAMS[state.away],attackingSide=Math.random()<home.attack/(home.attack+away.attack)?"home":"away",attack=TEAMS[state[attackingSide]],defend=TEAMS[state[attackingSide==="home"?"away":"home"]],attacker=choosePlayer(attackingSide,["LW","ST","RW","CAM","CM1","CM2"]),defenderSide=attackingSide==="home"?"away":"home",keeper=choosePlayer(defenderSide,["GK"]),chance=.105*(attack.attack/defend.defense)*(.84+Math.random()*.32);
if(Math.random()<chance){moveBallTo(attacker);
const goalChance=Math.max(.055,Math.min(.145,.105*(attack.attack/defend.defense)*(.85+Math.random()*.30)));
if(Math.random()<goalChance&&state.homeGoals+state.awayGoals<5)goal(attackingSide);
else if(Math.random()<.58&&keeper){moveBallTo(keeper);
pushComment(`Great save by ${lastName(keeper.name)}!`)}else{const miss=[`${lastName(attacker.name)} fires wide.`,`${lastName(attacker.name)} shoots, but the effort is blocked.`,`${lastName(attacker.name)} goes close.`,`${lastName(attacker.name)} has a chance, but cannot finish.`][Math.floor(Math.random()*4)];
pushComment(miss)}}else{const events=[`${lastName(attacker?.name||"The midfield")} helps move the ball forward.`,`${state[attackingSide]} build patiently from midfield.`,`Good pressure from ${state[attackingSide]}.`,`The midfield battle is intense.`,`A promising attack develops, but the defence holds firm.`,`The ball is worked down the flank.`];
if(attacker)moveBallTo(attacker);
if(Math.random()<.72)pushComment(events[Math.floor(Math.random()*events.length)])}updateScore()}

function drawPitch(){ctx.clearRect(0,0,canvas.width,canvas.height);
const g=ctx.createLinearGradient(0,0,0,PITCH.h);
g.addColorStop(0,"#2f8a49");
g.addColorStop(1,"#236a39");
ctx.fillStyle=g;
ctx.fillRect(0,0,PITCH.w,PITCH.h);
const stripeW=PITCH.w/10;
for(let i=0;
i<10;
i++){ctx.fillStyle=i%2===0?"rgba(255,255,255,.035)":"rgba(0,0,0,.025)";
ctx.fillRect(i*stripeW,0,stripeW,PITCH.h)}ctx.strokeStyle="rgba(255,255,255,.9)";
ctx.lineWidth=3;
ctx.strokeRect(18,18,PITCH.w-36,PITCH.h-36);
ctx.beginPath();
ctx.moveTo(500,18);
ctx.lineTo(500,PITCH.h-18);
ctx.stroke();
ctx.beginPath();
ctx.arc(500,310,82,0,Math.PI*2);
ctx.stroke();
ctx.beginPath();
ctx.arc(500,310,4,0,Math.PI*2);
ctx.fillStyle="#fff";
ctx.fill();
drawBox(18,180,145,260);
drawBox(837,180,145,260);
drawSmallBox(18,245,55,130);
drawSmallBox(927,245,55,130);
ctx.beginPath();
ctx.arc(145,310,75,-Math.PI/2,Math.PI/2);
ctx.stroke();
ctx.beginPath();
ctx.arc(855,310,75,Math.PI/2,Math.PI*1.5);
ctx.stroke();
drawGoal(-1);
drawGoal(1);
for(const p of state.players)drawPlayer(p);
drawBall()}

function drawBox(x,y,w,h){ctx.strokeRect(x,y,w,h)}function drawSmallBox(x,y,w,h){ctx.strokeRect(x,y,w,h)}

function drawGoal(side){const x=side<0?2:PITCH.w-2,dir=side<0?-1:1;
ctx.save();
ctx.strokeStyle="rgba(245,245,245,.95)";
ctx.lineWidth=3;
ctx.strokeRect(x+(dir<0?0:-42),245,42,130);
ctx.strokeStyle="rgba(255,255,255,.25)";
ctx.lineWidth=1;
for(let i=0;
i<=6;
i++){let yy=245+i*(130/6);
ctx.beginPath();
ctx.moveTo(x,yy);
ctx.lineTo(x+dir*42,yy);
ctx.stroke()}for(let i=0;
i<=4;
i++){let xx=x+dir*i*10.5;
ctx.beginPath();
ctx.moveTo(xx,245);
ctx.lineTo(xx,375);
ctx.stroke()}ctx.restore()}

function drawPlayer(p){if(p.onPitch===false)return;
const t=performance.now()/1000;
const rawX=p.baseX+Math.sin(t*1.35+p.phase)*2.8;
const x=p.side==="home"?Math.min(PITCH.centerX-55,rawX):Math.max(PITCH.centerX+55,rawX);
const y=p.baseY+Math.cos(t*1.1+p.phase)*2.3;
p.x=x;
p.y=y;
ctx.beginPath();
ctx.arc(x,y,p.radius+2,0,Math.PI*2);
ctx.fillStyle="rgba(0,0,0,.28)";
ctx.fill();
ctx.beginPath();
ctx.arc(x,y,p.radius,0,Math.PI*2);
ctx.fillStyle=p.color;
ctx.fill();
ctx.strokeStyle="#fff";
ctx.lineWidth=2;
ctx.stroke();
ctx.font="bold 9px Arial";
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillStyle="#fff";
ctx.fillText(p.role.replace("CM1","CM").replace("CM2","CM"),x,y);
const label=lastName(p.name).toUpperCase();
let fs=11;
while(fs>7){ctx.font=`800 ${fs}px Arial`;
if(ctx.measureText(label).width<=78)break;
fs--}ctx.textAlign="center";
ctx.textBaseline="top";
ctx.lineWidth=3;
ctx.strokeStyle="rgba(0,0,0,.85)";
ctx.fillStyle="#fff";
ctx.strokeText(label,x,y+22);
ctx.fillText(label,x,y+22)}

function drawBall(){if(!state.ball)return;
if(state.goalAnimation?.active){const a=state.goalAnimation,t=Math.min(1,(performance.now()-a.start)/a.duration),ease=1-Math.pow(1-t,3);
drawBallAt(a.startX+(a.netX-a.startX)*ease,a.startY+(a.netY-a.startY)*ease,6);
return}state.ball.x+=(state.ball.tx-state.ball.x)*.08;
state.ball.y+=(state.ball.ty-state.ball.y)*.08;
drawBallAt(state.ball.x,state.ball.y,6)}

function drawBallAt(x,y,r){ctx.beginPath();
ctx.arc(x+2,y+2,r+1,0,Math.PI*2);
ctx.fillStyle="rgba(0,0,0,.28)";
ctx.fill();
ctx.beginPath();
ctx.arc(x,y,r,0,Math.PI*2);
ctx.fillStyle="#fff";
ctx.fill();
ctx.strokeStyle="#111";
ctx.lineWidth=1.5;
ctx.stroke()}

function animationLoop(){drawPitch();
requestAnimationFrame(animationLoop)}

function resetMatch(){if(state.interval)clearInterval(state.interval);
state={home:homeSelect.value,away:awaySelect.value,minute:0,homeGoals:0,awayGoals:0,running:false,paused:false,halfTime:false,finished:false,interval:null,players:[],ball:null,goalAnimation:null};
initSubState();
setupPlayers();
resetBall();
clearCommentary();
updateSquads();
updateScore();
pushComment("Select the teams and press Start Match.");
pauseBtn.textContent="Pause"}

function ensureDifferentTeams(){if(homeSelect.value===awaySelect.value){awaySelect.value=Object.keys(TEAMS).find(t=>t!==homeSelect.value)}}

function startMatch(){ensureDifferentTeams();
if(state.running&&!state.finished)return;
state.home=homeSelect.value;
state.away=awaySelect.value;
state.minute=0;
state.homeGoals=0;
state.awayGoals=0;
state.running=true;
state.paused=false;
state.halfTime=false;
state.finished=false;
state.goalAnimation=null;
initSubState();
setupPlayers();
resetBall();
clearCommentary();
updateSquads();
updateScore();
pushComment(`Kick-off! ${state.home} vs ${state.away}.`);
if(state.interval)clearInterval(state.interval);
state.interval=setInterval(simulateMinute,500);
pauseBtn.textContent="Pause"}

function togglePause(){if(!state.running||state.finished)return;
state.paused=!state.paused;
pauseBtn.textContent=state.paused?"Resume":"Pause";
pushComment(state.paused?"Match paused.":"Match resumed.")}
homeSelect.addEventListener("change",()=>{ensureDifferentTeams();
if(state.running)resetMatch();
else{state.home=homeSelect.value;
updateSquads();
updateScore()}});
awaySelect.addEventListener("change",()=>{ensureDifferentTeams();
if(state.running)resetMatch();
else{state.away=awaySelect.value;
updateSquads();
updateScore()}});
startBtn.addEventListener("click",startMatch);
pauseBtn.addEventListener("click",togglePause);
resetBtn.addEventListener("click",resetMatch);
resetMatch();
animationLoop();
</script>
